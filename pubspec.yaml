name: taleemplus_app
description: "TaleemPlus - Offline-first AI-powered academy management app"
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # REST API Client
  http: ^1.2.1

  # State management (pick ONE — provider is simpler for a solo build)
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Connectivity (drives offline-first sync logic)
  connectivity_plus: ^6.0.3

  # OCR
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  # Web OCR engine (Tesseract.js) is reached through JS interop; `web` provides
  # the browser bindings. Harmless on mobile (only imported in the web engine).
  web: ^1.1.0

  # Machine learning runs in ml_service/ (Python, FastAPI) and is reached
  # through the backend's /admin/ml endpoints; nothing runs on-device.

  # Charts for Admin/Parent dashboards
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

  cupertino_icons: ^1.0.6
  # Inter font for the Flutter Web SaaS-style redesign (lib/core/web,
  # lib/widgets/web) — never referenced from mobile code paths.
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  pdf: ^3.13.0
  printing: ^5.13.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  file_picker: 13.2.0
  share_plus: 13.3.1
  flutter_map: 8.3.2
  latlong2: 0.10.1
  geolocator: 14.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/ml_models/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#061F1E"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"