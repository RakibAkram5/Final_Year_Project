name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests 🧪
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart & Flutter Tests
        run: flutter test

      # The Gradle wrapper is gitignored (Flutter default); --config-only
      # regenerates android/gradlew and the Gradle settings without building.
      - name: Generate Android Gradle wrapper
        run: flutter build apk --debug --config-only

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Lint & Unit Tests
        working-directory: android
        # Scope to the app module: `testDebugUnitTest` on every subproject also
        # runs the bundled Robolectric suites of third-party plugins
        # (image_picker, local_auth, shared_preferences), which cannot start
        # on this runner (SDK 36 under JDK 17) and are not TaleemPlus code.
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --continue

# Signed APK builds and GitHub Releases are produced only by main.yml
# ("TaleemPlus CI/CD") so a v* tag creates exactly one release.
