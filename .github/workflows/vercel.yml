name: Vercel deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Org and project IDs are identifiers, not credentials (they are also in
      # .vercel/project.json). Secrets of the same name override them.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_th1aXjvtbQnh76HQdvIIlLPV' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_rmtWnFRKABwLAELqoeNPMsoehxDT' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # Without a token there is nothing to deploy with: skip (not fail) so
      # the rest of CI stays meaningful. Add the VERCEL_TOKEN repository
      # secret to enable continuous deployment of the backend.
      - name: Check Vercel token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret is not set; skipping Vercel deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.token.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: '22'

      # `vercel build` runs `npm run vercel-build` (vercel.json), which builds
      # the Flutter web app into vercel_web/ with the Flutter SDK set up above
      # (tool/vercel_build_web.sh) and generates the Prisma client, so the
      # prebuilt output contains BOTH the web app and the API functions.
      - name: Pull Vercel project settings
        if: steps.token.outputs.ready == 'true'
        run: npx --yes vercel@39 pull --yes --environment=production --token "$VERCEL_TOKEN"

      # Apply pending Prisma migrations before the new code goes live, so the
      # deployed API never runs against an older schema. migrate deploy only
      # applies committed migrations; it never resets or drops data.
      - name: Apply database migrations
        if: steps.token.outputs.ready == 'true'
        run: |
          set -a; . .vercel/.env.production.local; set +a
          export DATABASE_URL="${DATABASE_URL_UNPOOLED:-$DATABASE_URL}"
          npm ci --ignore-scripts
          npx prisma migrate deploy --schema=taleemplus_backend/prisma/schema.prisma

      - name: Build with Vercel (static + API functions)
        if: steps.token.outputs.ready == 'true'
        run: npx --yes vercel@39 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        if: steps.token.outputs.ready == 'true'
        run: npx --yes vercel@39 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Verify production health
        if: steps.token.outputs.ready == 'true'
        run: |
          curl -fsS https://taleemplus.vercel.app/health | tee /dev/stderr | grep -q '"database":"connected"'
          code=$(curl -s -o /dev/null -w '%{http_code}' https://taleemplus.vercel.app/api/v2/auth/me)
          [ "$code" = "401" ] || { echo "::error::/api/v2/auth/me returned $code (expected 401)"; exit 1; }
