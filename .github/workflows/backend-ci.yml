name: Backend CI

on:
  push:
    branches: [ main, master, feature/firebase-to-node-postgresql, fix/ci-pipeline ]
  pull_request:
    branches: [ main, master, feature/firebase-to-node-postgresql ]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./taleemplus_backend

    # Disposable database: migrations and DB contract tests never touch a
    # shared or production database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taleemplus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/taleemplus_db?schema=public"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/taleemplus_db?schema=public"
      JWT_SECRET: "ci_jwt_secret_key_not_for_production"
      REFRESH_TOKEN_SECRET: "ci_refresh_secret_key_not_for_production"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './taleemplus_backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client & Apply Migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Verify migrations match the schema
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Check Flutter client calls against backend routes
        run: npm run check:routes

      - name: Run Jest Tests (unit + DB contract)
        run: npm test

  ml-service-test:
    name: Python ML service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ml_service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q
