name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Validate API origin
        id: api_config
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::API_BASE_URL is not configured; the Android release build will be skipped."
            exit 0
          fi
          case "$API_BASE_URL" in
            https://*/api/v2) ;;
            *)
              echo "::error::API_BASE_URL must be an HTTPS origin ending in /api/v2."
              exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Web release
        run: flutter build web --release

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: taleemplus-web-release
          path: build/web/
          if-no-files-found: error

      - name: Build Android release APK
        if: steps.api_config.outputs.configured == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload Android APK
        if: steps.api_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taleemplus-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
