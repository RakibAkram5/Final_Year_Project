name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Firebase options when available
        id: firebase_config
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            printf '%s' "$FIREBASE_OPTIONS" > lib/firebase_options.dart
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_OPTIONS is not configured; lint and tests will run, and Firebase-dependent release builds will be skipped."
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Web release
        if: steps.firebase_config.outputs.configured == 'true'
        run: flutter build web --release

      - name: Upload Web build
        if: steps.firebase_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taleemplus-web-release
          path: build/web/
          if-no-files-found: error

      - name: Build Android release APK
        if: steps.firebase_config.outputs.configured == 'true'
        run: flutter build apk --release

      - name: Upload Android APK
        if: steps.firebase_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taleemplus-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
