name: TaleemPlus CI/CD 🚀

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: Lint & Test 🧪
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # The app talks only to the REST API; no Firebase options or
      # google-services.json are injected (an empty secret used to overwrite
      # lib/firebase_options.dart and break compilation).
      - name: Install Dependencies
        run: flutter pub get

      - name: Check Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test --coverage

  build-android:
    name: Android Release 🤖
    needs: qa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Optional release signing. Without these secrets the APK is signed with
      # the debug key (fine for sideloading, not accepted by Google Play).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::KEYSTORE_BASE64 is not set; the APK will be debug-signed."
          fi

      # The production API (Express on Vercel). Override with the repository
      # variable API_BASE_URL if the backend moves.
      - name: Build APK + AAB
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://taleemplus.vercel.app/api/v2' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          case "$API_BASE_URL" in
            https://*/api/v2) ;;
            *)
              echo "::error::API_BASE_URL must be an HTTPS origin ending in /api/v2 (got '${API_BASE_URL:-<empty>}')."
              exit 1 ;;
          esac
          mkdir -p dist
          # Universal APK (installs on any device, direct sideload).
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          # Android App Bundle (Google Play distribution).
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/bundle/release/app-release.aab dist/app-release.aab
          ls -la dist

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/app-release.apk
            dist/app-release.aab
          if-no-files-found: error

  build-web:
    name: Web Build 🌐
    needs: qa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Vercel serves the API from the same origin (/api/v2), so the web
      # build needs no API_BASE_URL. Deployment is handled by vercel.yml.
      - name: Build Web
        run: flutter build web --release

      # Zip the build so index.html / assets sit at the archive ROOT — the
      # archive is a complete, directly deployable static site.
      - name: Package Web ZIP
        run: |
          mkdir -p dist
          (cd build/web && zip -r -X "$GITHUB_WORKSPACE/dist/TaleemPlus-Web.zip" .)
          ls -la dist

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist/TaleemPlus-Web.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Release 📦
    needs: [build-android, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: web

      # Rename every asset to TaleemPlus-<tag>-* and generate SHA-256 sums so
      # downloaders can verify integrity.
      - name: Assemble release assets + checksums
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p release
          cp "android/app-release.apk" "release/TaleemPlus-${TAG}-Android.apk"
          cp "android/app-release.aab" "release/TaleemPlus-${TAG}-Android.aab"
          cp "web/TaleemPlus-Web.zip"  "release/TaleemPlus-${TAG}-Web.zip"
          (cd release && sha256sum TaleemPlus-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TaleemPlus ${{ github.ref_name }} – Production Release
          body_path: RELEASE_NOTES.md
          files: |
            release/TaleemPlus-${{ github.ref_name }}-Android.apk
            release/TaleemPlus-${{ github.ref_name }}-Android.aab
            release/TaleemPlus-${{ github.ref_name }}-Web.zip
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
