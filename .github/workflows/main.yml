name: TaleemPlus CI/CD 🚀

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: Lint & Test 🧪
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # The app talks only to the REST API; no Firebase options or
      # google-services.json are injected (an empty secret used to overwrite
      # lib/firebase_options.dart and break compilation).
      - name: Install Dependencies
        run: flutter pub get

      - name: Check Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test --coverage

  build-android:
    name: Android Release 🤖
    needs: qa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Optional release signing. Without these secrets the APK is signed with
      # the debug key (fine for sideloading, not accepted by Google Play).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::KEYSTORE_BASE64 is not set; the APK will be debug-signed."
          fi

      # The production API (Express on Vercel). Override with the repository
      # variable API_BASE_URL if the backend moves.
      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://taleemplus.vercel.app/api/v2' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          case "$API_BASE_URL" in
            https://*/api/v2) ;;
            *)
              echo "::error::API_BASE_URL must be an HTTPS origin ending in /api/v2 (got '${API_BASE_URL:-<empty>}')."
              exit 1 ;;
          esac
          out=build/app/outputs/flutter-apk
          # Universal APK (installs on any device).
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          mkdir -p dist
          cp "$out/app-release.apk" dist/taleemplus-release.apk
          # Smaller per-architecture APKs.
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          for f in "$out"/app-*-release.apk; do
            name=$(basename "$f"); cp "$f" "dist/taleemplus-${name#app-}"
          done
          ls -la dist

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*.apk
          if-no-files-found: error

  build-web:
    name: Web Build 🌐
    needs: qa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Vercel serves the API from the same origin (/api/v2), so the web
      # build needs no API_BASE_URL. Deployment is handled by vercel.yml.
      - name: Build Web
        run: flutter build web --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web/
          if-no-files-found: error

  create-release:
    name: Create GitHub Release 📦
    needs: [build-android, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: TaleemPlus ${{ github.ref_name }}
          files: |
            *.apk
          draft: false
          prerelease: false
          generate_release_notes: true
