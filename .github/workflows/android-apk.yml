name: Build Android Release APK

# Manual build only. Tagged releases are built and published by main.yml.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify API origin is configured
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://taleemplus.vercel.app/api/v2' }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is not configured. Set the repository variable or secret API_BASE_URL to the production HTTPS API origin (for example https://api.example.com/api/v2)."
            exit 1
          fi

      - name: Build Release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://taleemplus.vercel.app/api/v2' }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taleemplus-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
